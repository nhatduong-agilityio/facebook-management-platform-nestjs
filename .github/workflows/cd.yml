# ─────────────────────────────────────────────────────────────────────────────
# CD — runs on every push to nestjs-practice (i.e. after a PR is merged).
#
# Builds the production Docker image (runner stage) and pushes it to GHCR.
# The image is tagged with both the commit SHA (immutable) and :latest.
#
# Deployment to a live server is a separate manual step — see deploy.yml.
#
# NOTE: the NestJS project lives in the facebook-creator-platform/ subdirectory.
# The Dockerfile is relative to that subdirectory.
# ─────────────────────────────────────────────────────────────────────────────

name: CD

on:
  push:
    branches: ["nestjs-practice"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/fcp-app

jobs:
  # ── Build and push Docker image to GHCR ────────────────────────────────────
  build-push:
    name: Build & push image
    runs-on: ubuntu-latest

    outputs:
      image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

    permissions:
      contents: read
      packages: write   # required to push to GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # GITHUB_TOKEN is auto-provided — no manual GHCR_TOKEN secret needed.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (production runner stage)
        uses: docker/build-push-action@v6
        with:
          # Dockerfile lives inside the facebook-creator-platform/ subdirectory.
          context: ./facebook-creator-platform
          # No --target = defaults to the final (runner) stage in the Dockerfile.
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          # Layer cache stored in GHA cache for faster rebuilds.
          cache-from: type=gha
          cache-to: type=gha,mode=max
