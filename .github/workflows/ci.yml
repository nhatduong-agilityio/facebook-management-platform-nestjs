# ─────────────────────────────────────────────────────────────────────────────
# CI — runs on every push and pull request (all branches).
#
# Steps: install → lint → build (TypeScript) → test (Vitest).
# No Docker build; no secrets required.
#
# NOTE: the NestJS project lives in the facebook-creator-platform/ subdirectory.
# All run steps use that as the working directory.
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  ci:
    name: Lint · Build · Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: facebook-creator-platform

    strategy:
      matrix:
        node-version: ["25"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm must be set up before setup-node so the cache key resolves.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
          cache-dependency-path: facebook-creator-platform/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build (all packages)
        # Catches TypeScript errors across every service and lib before tests run.
        run: pnpm -r build

      - name: Test (Vitest — all packages)
        run: pnpm test
