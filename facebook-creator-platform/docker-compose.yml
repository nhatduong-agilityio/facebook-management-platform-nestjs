# ─────────────────────────────────────────────────────────────────────────────
# Facebook Creator Platform — Docker Compose (production topology)
#
# Two workflows:
#
#   DEV  (auto-merges docker-compose.override.yml):
#     docker compose build               # builds fcp-app-dev (builder stage)
#     docker compose up -d               # hot-reload, NODE_ENV=development,
#                                        # DevAuthModule + dev-auth/token active
#
#   PROD (explicit file, no override):
#     docker compose -f docker-compose.yml build   # builds fcp-app (runner stage)
#     docker compose -f docker-compose.yml up -d   # NODE_ENV=production,
#                                                  # DevAuthModule absent
#
# In both modes the `migration` service runs all Postgres schema migrations
# before any app service starts (`depends_on: service_completed_successfully`).
#
# Other useful commands:
#   docker compose up -d postgres redis rabbitmq mongodb   # infra only
#   docker compose logs -f api                             # tail a service
# ─────────────────────────────────────────────────────────────────────────────

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: fcp-app
  restart: unless-stopped
  # Secrets (Clerk, Stripe, Facebook, Algolia, PII key, etc.) come from .env.
  # Infrastructure URLs defined below override the localhost values in .env.
  env_file: .env
  networks:
    - fcp
  depends_on:
    rabbitmq:
      condition: service_healthy

services:
  # ── Infrastructure ───────────────────────────────────────────────────────────

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fcp
      POSTGRES_PASSWORD: fcp
      POSTGRES_DB: fcp
    ports:
      - '5432:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - fcp
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fcp']
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    networks:
      - fcp
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    networks:
      - fcp
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rmq_data:/var/lib/rabbitmq
    networks:
      - fcp
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Migration (one-shot, runs before any app service) ───────────────────────
  # Runs all MikroORM migrations across the 5 Postgres schemas in order.
  # Exits 0 on success; any non-zero exit stops the entire compose stack.
  # Skips already-applied migrations (idempotent).

  migration:
    <<: *app
    command: >
      sh -c "node apps/api/dist/database/run-migrations.js &&
             node services/billing/dist/database/run-migrations.js &&
             node services/analytics/dist/database/run-migrations.js &&
             node services/notification/dist/database/run-migrations.js &&
             node services/email/dist/database/run-migrations.js"
    restart: "no"
    environment:
      DATABASE_URL: postgres://fcp:fcp@postgres:5432/fcp
    depends_on:
      postgres:
        condition: service_healthy

  # ── Application services ─────────────────────────────────────────────────────

  billing:
    <<: *app
    command: node services/billing/dist/main.js
    ports:
      - '3001:3001'
      - '4001:4001'
    environment:
      BILLING_PORT: '3001'
      BILLING_TCP_PORT: '4001'
      BILLING_TCP_HOST: '0.0.0.0'
      DATABASE_URL: postgres://fcp:fcp@postgres:5432/fcp
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      migration:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'nc -z localhost 3001']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  analytics:
    <<: *app
    command: node services/analytics/dist/main.js
    ports:
      - '3002:3002'
    environment:
      ANALYTICS_PORT: '3002'
      DATABASE_URL: postgres://fcp:fcp@postgres:5432/fcp
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      migration:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'nc -z localhost 3002']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  audit:
    <<: *app
    command: node services/audit/dist/main.js
    ports:
      - '3003:3003'
    environment:
      AUDIT_PORT: '3003'
      MONGODB_URI: mongodb://mongodb:27017/fcp_audit
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'nc -z localhost 3003']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  search:
    <<: *app
    command: node services/search/dist/main.js
    ports:
      - '3004:3004'
    environment:
      SEARCH_PORT: '3004'
      DATABASE_URL: postgres://fcp:fcp@postgres:5432/fcp
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'nc -z localhost 3004']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  notification:
    <<: *app
    command: node services/notification/dist/main.js
    ports:
      - '3005:3005'
    environment:
      NOTIFICATION_PORT: '3005'
      DATABASE_URL: postgres://fcp:fcp@postgres:5432/fcp
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      migration:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'nc -z localhost 3005']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  email:
    <<: *app
    command: node services/email/dist/main.js
    environment:
      DATABASE_URL: postgres://fcp:fcp@postgres:5432/fcp
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      migration:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  api:
    <<: *app
    command: node apps/api/dist/main.js
    ports:
      - '3000:3000'
    environment:
      PORT: '3000'
      DATABASE_URL: postgres://fcp:fcp@postgres:5432/fcp
      MONGODB_URI: mongodb://mongodb:27017/fcp_audit
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      # TCP clients — use Docker service names as hosts (ADR-094, ADR-108)
      BILLING_TCP_HOST: billing
      BILLING_TCP_PORT: '4001'
      ANALYTICS_TCP_HOST: analytics
      ANALYTICS_TCP_PORT: '3002'
      AUDIT_TCP_HOST: audit
      AUDIT_TCP_PORT: '3003'
      SEARCH_TCP_HOST: search
      SEARCH_TCP_PORT: '3004'
      NOTIFICATION_TCP_HOST: notification
      NOTIFICATION_TCP_PORT: '3005'
      # Stripe browser redirects must be browser-reachable (localhost, not docker hostname)
      BILLING_SUCCESS_URL: http://localhost:3000/api/v1/billing/success
      BILLING_CANCEL_URL: http://localhost:3000/api/v1/billing/cancel
    depends_on:
      migration:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      billing:
        condition: service_healthy
      analytics:
        condition: service_healthy
      audit:
        condition: service_healthy
      search:
        condition: service_healthy
      notification:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/api/v1/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

# ─────────────────────────────────────────────────────────────────────────────
# Migrations run automatically via the `migration` service above.
# `docker compose up -d` runs all pending migrations before any app starts.
#
# To run migrations manually (dev, outside Docker):
#   pnpm migration              # core schema (apps/api)
#   pnpm migration:billing      # billing schema
#   pnpm migration:analytics    # analytics schema
#   pnpm migration:notification # notification schema
#   pnpm migration:email        # email schema (delivery log)
# ─────────────────────────────────────────────────────────────────────────────

networks:
  fcp:
    # Explicit name avoids the default "{project}_fcp" prefix so that
    # one-shot containers (migration runner, smoke tests) can join with
    # --network fcp without knowing the compose project name.
    name: fcp
    driver: bridge

volumes:
  pg_data:
  mongo_data:
  rmq_data:
