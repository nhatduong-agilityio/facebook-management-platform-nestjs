# ─────────────────────────────────────────────────────────────────────────────
# CD — runs on every push to nestjs-practice (i.e. after a PR is merged).
#
# Three sequential jobs:
#   1. build-push  — Build Docker image (runner stage) → push to GHCR.
#   2. deploy      — SSH into production host:
#                      • Pull new image + retag as fcp-app:latest
#                      • Run all schema migrations (fail fast on error)
#                      • docker compose -f docker-compose.yml up -d --no-build
#                      • Health gate: poll /api/v1/health until 200 (120s max)
#   3. smoke       — Run Artillery smoke test from GHA runner against live API.
#
# Required GitHub Secrets (see docs/DECISIONS.md § ADR-INF-03):
#   DEPLOY_HOST      — SSH hostname or IP of production server
#   DEPLOY_USER      — SSH username (e.g. ubuntu, deploy)
#   DEPLOY_SSH_KEY   — SSH private key (PEM)
#   API_URL          — Public base URL of deployed API (e.g. https://api.example.com)
#   TEST_JWT         — Valid Clerk JWT for a seeded test user (smoke test auth)
#
# App secrets (CLERK_*, STRIPE_*, etc.) live in /opt/fcp/.env on the deploy
# host — they are never passed through this workflow.
# ─────────────────────────────────────────────────────────────────────────────

name: CD

on:
  push:
    branches: ["nestjs-practice"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/fcp-app

jobs:
  # ── Job 1: Build and push Docker image to GHCR ─────────────────────────────
  build-push:
    name: Build & push image
    runs-on: ubuntu-latest

    outputs:
      image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

    permissions:
      contents: read
      packages: write   # required to push to GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # GITHUB_TOKEN is auto-provided — no manual GHCR_TOKEN secret needed.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (production runner stage)
        uses: docker/build-push-action@v6
        with:
          context: .
          # No --target = defaults to the final (runner) stage in the Dockerfile.
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          # Layer cache stored in GHA cache for faster rebuilds.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 2: Deploy to production host ───────────────────────────────────────
  deploy:
    name: Deploy
    needs: build-push
    runs-on: ubuntu-latest

    steps:
      - name: Pull image, migrate, start services, health-gate
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # GitHub Actions evaluates ${{ }} expressions before the SSH action
          # runs, so SHA and image name are expanded to literal strings in the
          # script that reaches the remote host.
          script: |
            set -e

            IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

            echo "==> Pulling new image: $IMAGE"
            docker pull "$IMAGE"

            # Retag so docker-compose.yml (image: fcp-app) picks up the new build.
            docker tag "$IMAGE" fcp-app:latest

            echo "==> Running schema migrations"
            # --network host lets the container reach postgres:5432 via localhost.
            # --env-file passes DATABASE_URL and other vars from the host .env.
            docker run --rm \
              --network host \
              --env-file /opt/fcp/.env \
              "$IMAGE" \
              sh -c "
                node apps/api/dist/database/run-migrations.js &&
                node services/billing/dist/database/run-migrations.js &&
                node services/analytics/dist/database/run-migrations.js &&
                node services/notification/dist/database/run-migrations.js &&
                node services/email/dist/database/run-migrations.js
              "

            echo "==> Starting services (production compose, no override)"
            cd /opt/fcp
            # --no-build: use the retagged fcp-app:latest; never rebuild on deploy.
            docker compose -f docker-compose.yml up -d --no-build

            echo "==> Health gate (max 120 s)"
            for i in $(seq 1 12); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                http://localhost:3000/api/v1/health 2>/dev/null || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "Health gate passed on attempt $i"
                exit 0
              fi
              echo "Attempt $i/12: status=$STATUS — waiting 10 s..."
              sleep 10
            done
            echo "ERROR: health gate failed after 120 s"
            exit 1

  # ── Job 3: Smoke test against the live deployment ──────────────────────────
  smoke:
    name: Smoke test
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node 25
        uses: actions/setup-node@v4
        with:
          node-version: "25"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Artillery smoke test
        # Override the default localhost target with the live API URL.
        # --record is omitted — no Artillery Cloud token required.
        run: |
          npx artillery run \
            --target "$API_URL" \
            --output test/load/reports/smoke-cd.json \
            test/load/smoke.yml
        env:
          API_URL: ${{ secrets.API_URL }}
          TEST_JWT: ${{ secrets.TEST_JWT }}
