<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620" font-family="Arial, sans-serif">
  <rect width="980" height="620" fill="#ffffff"/>
  <text x="490" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1F6FC4">Subscription State Machine — Billing Service (Stripe)</text>
  <text x="490" y="58" text-anchor="middle" font-size="11.5" fill="#555">Guarded transitions · every transition writes a billing_events row (from → to, actor, timestamp) · illegal transitions rejected as Result.Err</text>

  <!-- defs -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#34495e"/>
    </marker>
  </defs>

  <!-- START -->
  <circle cx="120" cy="150" r="12" fill="#34495e"/>
  <text x="120" y="125" text-anchor="middle" font-size="11" fill="#555">start</text>

  <!-- States -->
  <!-- trialing -->
  <rect x="250" y="118" width="150" height="64" rx="10" fill="#dce6f2" stroke="#1F6FC4" stroke-width="2"/>
  <text x="325" y="148" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a3c6e">trialing</text>
  <text x="325" y="166" text-anchor="middle" font-size="10" fill="#555">(TRIAL)</text>

  <!-- active -->
  <rect x="540" y="118" width="150" height="64" rx="10" fill="#d8efe0" stroke="#1e8449" stroke-width="2"/>
  <text x="615" y="148" text-anchor="middle" font-size="15" font-weight="bold" fill="#145a32">active</text>
  <text x="615" y="166" text-anchor="middle" font-size="10" fill="#555">(ACTIVE)</text>

  <!-- grace_period -->
  <rect x="540" y="320" width="150" height="64" rx="10" fill="#fdf0d5" stroke="#b9770e" stroke-width="2"/>
  <text x="615" y="350" text-anchor="middle" font-size="15" font-weight="bold" fill="#7e5109">grace_period</text>
  <text x="615" y="368" text-anchor="middle" font-size="10" fill="#555">(PAST_DUE)</text>

  <!-- cancelled -->
  <rect x="250" y="320" width="150" height="64" rx="10" fill="#f9d7d4" stroke="#C0392B" stroke-width="2"/>
  <text x="325" y="350" text-anchor="middle" font-size="15" font-weight="bold" fill="#922b21">cancelled</text>
  <text x="325" y="368" text-anchor="middle" font-size="10" fill="#555">(terminal)</text>

  <!-- END -->
  <circle cx="120" cy="352" r="12" fill="none" stroke="#34495e" stroke-width="2"/>
  <circle cx="120" cy="352" r="6" fill="#34495e"/>

  <!-- Transitions -->
  <!-- start -> trialing -->
  <line x1="132" y1="150" x2="248" y2="150" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="190" y="142" text-anchor="middle" font-size="10" fill="#333">checkout.completed</text>
  <text x="190" y="115" text-anchor="middle" font-size="10" fill="#333">/ free signup</text>

  <!-- trialing -> active -->
  <line x1="400" y1="150" x2="538" y2="150" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="469" y="142" text-anchor="middle" font-size="10" fill="#333">invoice.paid</text>

  <!-- active -> grace_period -->
  <line x1="615" y1="182" x2="615" y2="318" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="625" y="255" font-size="10" fill="#333">invoice.payment_failed</text>
  <text x="625" y="270" font-size="10" fill="#333">→ set grace_period_end</text>

  <!-- grace_period -> active (recover) -->
  <path d="M 575,320 C 540,260 540,210 575,184" fill="none" stroke="#1e8449" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="505" y="255" text-anchor="middle" font-size="10" fill="#1e8449">invoice.paid</text>
  <text x="505" y="270" text-anchor="middle" font-size="10" fill="#1e8449">(recovered)</text>

  <!-- trialing -> grace_period (trial expired) -->
  <path d="M 360,182 C 430,250 470,290 538,340" fill="none" stroke="#b9770e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="430" y="320" text-anchor="middle" font-size="10" fill="#b9770e">trial expired, no payment</text>

  <!-- grace_period -> cancelled -->
  <line x1="538" y1="352" x2="402" y2="352" stroke="#C0392B" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="470" y="344" text-anchor="middle" font-size="10" fill="#C0392B">grace expired</text>

  <!-- active -> cancelled (subscription.deleted) -->
  <path d="M 540,160 C 430,200 380,260 360,318" fill="none" stroke="#C0392B" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="430" y="205" text-anchor="middle" font-size="10" fill="#C0392B">customer.subscription.deleted</text>

  <!-- cancelled -> end -->
  <line x1="248" y1="352" x2="134" y2="352" stroke="#34495e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Free-plan guard note -->
  <rect x="250" y="430" width="500" height="60" rx="8" fill="#f4f6f8" stroke="#B7C2CC"/>
  <text x="265" y="452" font-size="11" font-weight="bold" fill="#333">Free-plan guard (BR-F10):</text>
  <text x="265" y="470" font-size="11" fill="#333">code = 'free' may only be trialing or active — grace_period / cancelled transitions disabled,</text>
  <text x="265" y="485" font-size="11" fill="#333">grace_period_end stays NULL. No Stripe customer exists to be past-due on.</text>

  <!-- Logging lane -->
  <rect x="250" y="510" width="500" height="60" rx="8" fill="#eef5fb" stroke="#1F6FC4"/>
  <text x="265" y="532" font-size="11" font-weight="bold" fill="#1a3c6e">Transition log (every edge):</text>
  <text x="265" y="550" font-size="11" fill="#333">billing_events { stripe_event_id, event_type, from_state, to_state, actor, occurred_at }</text>
  <text x="265" y="565" font-size="11" fill="#333">emits SubscriptionActivated / SubscriptionPastDue / SubscriptionCancelled to RabbitMQ.</text>
</svg>